[project]
name = "oceantrace-vision"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "oceantrace-common",
    "pydantic>=2.8.0",
    "rasterio>=1.4.0",
    "numpy>=2.0.0",
    "torch>=2.0.0",
    "scipy>=1.10.0",
    "shapely>=2.0.0",
    "pyproj>=3.5.0",
]

[project.optional-dependencies]
onnx = ["onnxruntime>=1.15.0"]
tensorrt = ["tensorrt>=8.6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"