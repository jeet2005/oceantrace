name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e packages/common -e packages/vision -e packages/drift -e packages/ais -e packages/attribution -e packages/rag -e packages/geospatial -e packages/knowledge -e packages/agents -e packages/evaluation -e apps/api -e ".[dev]"
      - run: ruff check .
      - run: mypy apps/api/src packages tests
      - run: pytest
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
        working-directory: apps/web
      - run: npm test
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web
